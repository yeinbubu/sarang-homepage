<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사랑한의원 | 홈페이지 준비 중</title>
  <meta name="description" content="사랑한의원 홈페이지를 준비하고 있습니다.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: linear-gradient(160deg, #fdf8f3 0%, #f3ede4 100%);
      color: #3a3a3a;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      max-width: 460px;
      width: 100%;
      padding: 56px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(120, 90, 60, 0.10);
    }
    .mark {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #8b5e3c;
      color: #fff;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 30px; color: #5a3d2b; margin-bottom: 6px; letter-spacing: 2px; }
    .en { font-size: 13px; color: #a08670; letter-spacing: 3px; margin-bottom: 32px; }
    .msg { font-size: 17px; line-height: 1.7; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">愛</div>
    <h1>사랑한의원</h1>
    <p class="en">SARANG KOREAN MEDICINE CLINIC</p>
    <p class="msg">홈페이지를 새롭게 준비하고 있습니다.</p>
    <p class="sub">곧 더 좋은 모습으로 찾아뵙겠습니다.</p>
  </div>
</body>
</html>
